<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Elcentral-kollen — webbblock | Ampy</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Elcentral-kollen som webbblock för landningssidor. Förhandsvisning av blocket, utan sidchrome." />
  <link rel="stylesheet" href="../assets/elcentralkollen.css?v=2.22.3" />
  <style>
    /* Endast det som behövs för att visa BLOCKET fristående. Ingen header, ingen meny,
       ingen hero, ingen footer — blocket är hela leveransen. På den riktiga sidan ärver
       det sektionens bakgrund; här står det på sidans egen vita yta. */
    html, body { margin: 0; padding: 0; }
    body { background: #fff; }
  </style>
</head>
<body>

  <!-- ==========================================================================
       ELCENTRAL-KOLLEN — BLOCKLÄGE
       I Bricks motsvarar detta EN shortcode i ett Shortcode/Kod-element:
           [elcentralkollen layout="block" placement="elcentral-lp"]
       Lägg INGEN egen rubrik ovanför i Bricks — blocket har sin egen H2.
       ========================================================================== -->
  <div class="ampy-ec" lang="sv" data-layout="block" data-placement="elcentral-lp"
       data-data-url="../data/elcentralkollen-data.json">
    <div class="ampy-ec__noscript">
      <div class="ampy-ec__block">
        <p>Elcentral-kollen: svara på sju frågor om din elcentral och få ett besked på två punkter, säker i dag och redo för det du planerar. Verktyget kräver JavaScript.</p>
      </div>
    </div>
  </div>

  <script src="../assets/elcentralkollen.js?v=2.22.3"></script>
</body>
</html>
